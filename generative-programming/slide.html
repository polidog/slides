<h1 id="%E8%87%AA%E7%84%B6%E8%A8%80%E8%AA%9E%E3%81%AE%E9%99%90%E7%95%8C">自然言語の限界</h1>
<p>自然言語で書かれた仕様には、<strong>解釈の幅</strong>があります。</p>
<ul>
<li>人によって読み方が変わる</li>
<li>LLMの解釈も毎回同じとは限らない</li>
<li>ドキュメントは<strong>実行できない</strong></li>
<li>ドキュメントは<strong>検証できない</strong></li>
<li>仕様とコードが乖離しても<strong>検知する仕組みがない</strong></li>
</ul>
<p><strong>認知の基盤としては、不安定です。</strong></p>

<h1 id="%E3%82%B7%E3%82%B9%E3%83%86%E3%83%A0%E3%81%AF%E3%82%B3%E3%83%BC%E3%83%89%E3%81%A0%E3%81%91%E3%81%A7%E3%81%AF%E3%81%AA%E3%81%84">システムはコードだけではない</h1>

<li><strong>データとその流れ</strong></li>
<li><strong>ビジネスルールとその変化</strong></li>
<li><strong>組織やプロセス</strong></li>
</ul>
